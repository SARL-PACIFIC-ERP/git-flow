name: Main workflow for odoo.sh projects repositories

on:
  workflow_call:
    secrets:
      token:
        required: true

jobs:
  deploy-in-production:
    runs-on: ubuntu-latest
    steps:
      # Checkout production branch
      - name: Checkout production
        # Checks-out repository under $GITHUB_WORKSPACE, so job can access it
        uses: actions/checkout@v4
        with:
          # Fetch the whole history to prevent unrelated history errors
          fetch-depth: '0'
          # The branch we want to merge on
          ref: 'production'
          # The token for authentication
          token: ${{ secrets.token }}

      # Fetch staging hash
      - name: Fetch staging head hash
        run: |
          echo "staging_sha=$(git rev-parse origin/staging)" >> $GITHUB_ENV

      # Throw error if hashes mistmatch
      - name: Mismatching hashes error
        # Only if hashes are not matching
        if: ${{ github.sha != env.staging_sha }}
        run: |
          echo "::error::Hashes mismatch - Release does not point the latest commit in staging branch"
          echo ${{ env.staging_sha }} " (Last staging commit hash)"
          echo ${{ github.sha }} " (Tag hash)"
          exit 1

      # Merge staging into production: try fast-forward, fall back to merge commit
      - name: Merge staging (ff then fallback)
        # Only if hashes are matching
        if: ${{ github.sha == env.staging_sha }}
        run: |
          git fetch origin
          # Use specific SHA to avoid race conditions if origin/staging moved
          if git merge --ff-only ${{ env.staging_sha }}; then
            git push origin production
          else
            echo "Fast-forward not possible, attempting a merge commit"
            # Configure bot identity for merge commit
            git config user.name "github-actions[bot]"
            # Official GitHub Actions Bot identity
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git merge --no-ff --no-edit ${{ env.staging_sha }}; then
              git push origin production
            else
              echo "::error::Merge failed due to conflicts; aborting"
              git merge --abort || true
              exit 1
            fi
          fi
